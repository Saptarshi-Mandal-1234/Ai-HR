services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aihr
      POSTGRES_USER: aihr
      POSTGRES_PASSWORD: aihr_local_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihr -d aihr"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aihr-postgres:/var/lib/postgresql/data

  ai-hr:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      AIHR_AUTH_REQUIRED: "true"
      DATABASE_URL: postgresql://aihr:aihr_local_password@postgres:5432/aihr
      DATABASE_SSL: disable
      AIHR_IMPORT_JSON: "true"
      AIHR_ORGANIZATION_ID: local-company
      AIHR_ALLOWED_ORIGIN: http://localhost:3000

volumes:
  aihr-postgres:
